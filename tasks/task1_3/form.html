<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Task 1.3</title>
    </head>
    <body>
        <form action="https://httpbin.io/dump/request" method="POST">
            <label for="name">Enter your name:</label>
            <input type="text" id="name" name="name">
            <p></p>

            <label for="email">Enter your email address:</label>
            <input type="email" id="email" name="email">
            <p></p>

            <label for="dob">Enter your Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <p></p>

            <label for="favColour">Input your favourite colour:</label>
            <input type="color" id="favColour" name="favColour">
            <p></p>

            <fieldset>
                <legend>Are you a student or staff member?</legend>

                <label for="student">Student</label>
                <input type="radio" id="student" name="role" value="student" checked>

                <label for="staff">Member of Staff</label>
                <input type="radio" id="staff" name="role" value="staff">
            </fieldset>
            <p></p>

            <button>Submit</button>
        </form>
    </body>
</html>
